<header class="header-container">
  <h1>{{ headerText }}</h1>
  @if (canShowInfo()) {
    <shared-icon-button
      tone="primary"
      appearance="text"
      [ariaLabel]="infoAriaLabel"
      (activated)="onInfoClick()"
    >
      <mat-icon aria-hidden="true">{{ iconName }}</mat-icon>
    </shared-icon-button>
  }
</header>
