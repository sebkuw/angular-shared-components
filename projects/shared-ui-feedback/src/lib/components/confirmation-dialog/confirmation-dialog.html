<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>

<div mat-dialog-actions>
  <shared-action-bar [ariaLabel]="data.actionsAriaLabel" alignment="end">
    <shared-button
      appearance="outlined"
      tone="neutral"
      [ariaLabel]="data.cancelAriaLabel || data.cancelLabel"
      (activated)="cancel()"
    >
      {{ data.cancelLabel }}
    </shared-button>
    <shared-button
      [tone]="data.confirmTone"
      [access]="data.confirmAccess || publicAccess"
      [ariaLabel]="data.confirmAriaLabel || data.confirmLabel"
      (activated)="confirm()"
    >
      {{ data.confirmLabel }}
    </shared-button>
  </shared-action-bar>
</div>
