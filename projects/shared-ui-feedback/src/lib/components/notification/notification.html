<div
  class="notification-container"
  [ngClass]="'notification--' + data.type"
  [attr.role]="role"
  [attr.aria-live]="ariaLive"
  aria-atomic="true"
>
  <mat-icon class="notification-icon" aria-hidden="true">{{ iconName }}</mat-icon>
  <span class="notification-message">{{ data.message }}</span>
  @if (canShowAction()) {
    <shared-button
      tone="neutral"
      appearance="text"
      size="small"
      (activated)="snackBarRef.dismissWithAction()"
    >
      {{ data.action?.label }}
    </shared-button>
  }
  <shared-icon-button
    tone="neutral"
    appearance="text"
    size="small"
    class="notification-close-btn"
    [ariaLabel]="data.dismissLabel || 'Dismiss notification'"
    (activated)="snackBarRef.dismiss()"
  >
    <mat-icon aria-hidden="true">close</mat-icon>
  </shared-icon-button>
</div>
