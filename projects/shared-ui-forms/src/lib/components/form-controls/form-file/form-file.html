<div [formGroup]="formGroup" class="file-input-container">
  <input
    type="file"
    [id]="field.key"
    class="hidden-file-input"
    #fileInput
    (change)="onFileSelected($event)"
    [accept]="field.acceptedFileTypes || '*/*'"
    [disabled]="disabled"
    [attr.aria-label]="field.ariaLabel || field.label"
    [attr.aria-describedby]="ariaDescribedBy"
  />

  <div class="file-input-controls">
    <shared-button
      appearance="outlined"
      type="button"
      (activated)="fileInput.click()"
      [disabled]="disabled"
      [ariaLabel]="field.ariaLabel || field.label"
      [ariaDescribedBy]="ariaDescribedBy || undefined"
    >
      <mat-icon sharedButtonIcon aria-hidden="true">attach_file</mat-icon>
      {{ field.placeholder || 'Wybierz plik' }}
    </shared-button>

    @if (fileName) {
      <div class="file-name-display">
        <span>{{ fileName }}</span>
        <shared-icon-button
          type="button"
          (activated)="clearFile()"
          [ariaLabel]="field.clearLabel || 'Clear file'"
          [disabled]="disabled"
        >
          <mat-icon aria-hidden="true">close</mat-icon>
        </shared-icon-button>
      </div>
    }
  </div>

  @if (control?.touched && control?.invalid) {
    <mat-error>{{ getErrorMessage() }}</mat-error>
  }
</div>
