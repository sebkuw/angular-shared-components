name: Publish GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@sebkuw'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Test libraries
        run: npm test

      - name: Publish libraries
        run: |
          npm publish ./dist/shared-ui-core
          npm publish ./dist/shared-ui-theme
          npm publish ./dist/shared-ui-primitives
          npm publish ./dist/shared-ui-forms
          npm publish ./dist/shared-ui-list
          npm publish ./dist/shared-ui-layout
          npm publish ./dist/shared-ui-feedback
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
