<nav class="side-menu-container" [class.collapsed]="collapsed" [attr.aria-label]="ariaLabel">
  <ul class="menu-body">
    @for (item of menuService.flatMenuItems(); track item.id) {
      <li class="menu-list-item">
        @if (hasChildren(item)) {
          <button
            type="button"
            class="menu-row"
            [style.padding-left.px]="collapsed ? null : item.level * 16"
            [attr.data-level]="item.level"
            [attr.aria-expanded]="item.expanded"
            [attr.aria-label]="item.ariaLabel || item.title"
            (click)="toggleItem(item)"
          >
            @if (item.icon) {
              <mat-icon class="item-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
            }
            <span class="item-title" [class.visually-hidden]="collapsed">{{ item.title }}</span>
            @if (item.badge) {
              <shared-badge
                class="item-badge"
                [value]="item.badge.value"
                [tone]="item.badge.tone || 'neutral'"
                [max]="item.badge.max ?? 99"
                [showZero]="item.badge.showZero ?? false"
                [ariaLabel]="item.badge.ariaLabel"
                [announcement]="item.badge.announcement || 'off'"
              />
            }
            <mat-icon class="expand-icon" aria-hidden="true">
              {{ item.expanded ? 'expand_less' : 'expand_more' }}
            </mat-icon>
          </button>
        } @else {
          <a
            class="menu-row"
            [style.padding-left.px]="collapsed ? null : item.level * 16"
            [attr.data-level]="item.level"
            [attr.aria-label]="item.ariaLabel || item.title"
            [routerLink]="item.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            @if (item.icon) {
              <mat-icon class="item-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
            }
            <span class="item-title" [class.visually-hidden]="collapsed">{{ item.title }}</span>
            @if (item.badge) {
              <shared-badge
                class="item-badge"
                [value]="item.badge.value"
                [tone]="item.badge.tone || 'neutral'"
                [max]="item.badge.max ?? 99"
                [showZero]="item.badge.showZero ?? false"
                [ariaLabel]="item.badge.ariaLabel"
                [announcement]="item.badge.announcement || 'off'"
              />
            }
          </a>
        }
      </li>
    }
  </ul>
</nav>
